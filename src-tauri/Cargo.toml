[package]
name = "ebarangay-books"
version = "0.1.0"
description = "Offline accounting books for Pagadian City barangays"
authors = ["City Accounting Office, Pagadian City"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
# Needed by src/db_bridge.rs to borrow the pool tauri-plugin-sql already owns.
# Must stay semver-compatible with the sqlx that tauri-plugin-sql itself uses
# (0.8.x), or `Pool<Sqlite>` becomes a different, incompatible type.
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio"] }
