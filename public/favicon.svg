<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- The app's own mark, replacing Vite's boilerplate logo: the prototype's
       "building" glyph on the primary teal, drawn at the same 12px-on-44px
       corner ratio as the topbar logo. Hand-written rather than exported from a
       tool, so it stays a few hundred bytes and needs no build step. -->
  <rect width="32" height="32" rx="9" fill="#0F6B5C"/>
  <g transform="translate(4 4)" fill="none" stroke="#FFFFFF" stroke-width="2"
     stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="3" width="16" height="18" rx="1"/>
    <path d="M9 8h.01M15 8h.01M9 12h.01M15 12h.01M9 16h.01M15 16h.01"/>
  </g>
</svg>
